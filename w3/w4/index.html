<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 - 咖波風格</title>
  
  <style>
    /* =========================================================
       【CSS 樣式變數設定】
       方便後續自訂色彩與主題風格
       ========================================================= */
    :root {
      /* 咖波視覺主題色系 */
      --capoo-blue: #00a8e8;       /* 咖波經典藍 */
      --capoo-dark-blue: #0077b6;  /* 深藍色 (邊框、強調) */
      --capoo-light-blue: #e0f7fa; /* 淺藍背景 */
      --capoo-pink: #ff8fa3;       /* 肉肉/奶西粉紅 */
      --capoo-yellow: #ffd166;     /* 亮黃色 (Highlight 亮起點綴) */
      --capoo-bg: #f0f9ff;         /* 全域網頁背景色 */
      --card-bg: #ffffff;          /* 卡片背景色 */
      --text-color: #2b2d42;       /* 主要文字顏色 */
      
      /* 動畫與輪播設定 */
      --transition-speed: 0.5s;    /* 卡片輪播切換的平滑時間 */
    }

    /* 全域基礎樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Comic Sans MS", "Chalkboard SE", "Yu Gothic", "Microsoft JhengHei", sans-serif;
      background-color: var(--capoo-bg);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    /* 頁頭標題區塊 */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--capoo-dark-blue);
      text-shadow: 2px 2px 0px var(--capoo-pink);
      display: inline-block;
      background: white;
      padding: 12px 28px;
      border-radius: 50px;
      border: 4px solid var(--capoo-dark-blue);
      box-shadow: 0 8px 0px var(--capoo-dark-blue);
    }

    /* =========================================================
       【酷炫載入中 (Loading) 動畫樣式】
       ========================================================= */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .capoo-loader {
      width: 70px;
      height: 70px;
      background-color: var(--capoo-blue);
      border-radius: 50% 50% 45% 45%;
      border: 4px solid var(--capoo-dark-blue);
      position: relative;
      animation: capooBounce 0.6s infinite alternate ease-in-out;
    }

    /* 咖波的小耳朵點綴 */
    .capoo-loader::before, .capoo-loader::after {
      content: "";
      position: absolute;
      top: -6px;
      width: 16px;
      height: 16px;
      background-color: var(--capoo-blue);
      border: 3px solid var(--capoo-dark-blue);
      border-radius: 4px;
    }
    .capoo-loader::before { left: 6px; transform: rotate(-15deg); }
    .capoo-loader::after { right: 6px; transform: rotate(15deg); }

    /* 上下彈跳動畫 */
    @keyframes capooBounce {
      0% { transform: translateY(0) scale110(1, 0.9); }
      100% { transform: translateY(-30px) scale(0.95, 1.05); }
    }

    .loading-text {
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--capoo-dark-blue);
      letter-spacing: 2px;
    }

    /* =========================================================
       【瀑布流排版 (Masonry Layout)】
       使用 CSS Column 做錯落排列
       ========================================================= */
    .masonry-wall {
      column-count: 4;       /* 預設大螢幕顯示 4 欄 */
      column-gap: 20px;      /* 欄位之間的間距 */
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 響應式斷點設計 */
    @media (max-width: 1024px) { .masonry-wall { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-wall { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-wall { column-count: 1; } }

    /* =========================================================
       【留言卡片基礎樣式】
       ========================================================= */
    .card {
      background-color: var(--card-bg);
      border: 3px solid var(--capoo-dark-blue);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      break-inside: avoid;   /* 防止卡片在瀑布流中被截斷 */
      box-shadow: 0 6px 0px var(--capoo-dark-blue);
      transition: all var(--transition-speed) ease-in-out;
      position: relative;
      opacity: 1;
      filter: blur(0px);
      transform: scale(1);
    }

    /* 卡片頭部：名字與可愛標籤 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px dashed var(--capoo-light-blue);
    }

    .card-name {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--capoo-dark-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-name::before {
      content: "🐾";
      font-size: 0.9rem;
    }

    .card-time {
      font-size: 0.75rem;
      color: #8d99ae;
    }

    /* 卡片留言內容區 */
    .card-content {
      font-size: 0.98rem;
      line-height: 1.6;
      word-wrap: break-word;
      color: #333;
    }

    /* =========================================================
       【輪播特效：亮起 (Highlight) 與 變暗 (Dim) 狀態】
       ========================================================= */
    
    /* 被選中的焦點卡片：放大、發光、邊框變色 */
    .card.highlight {
      transform: scale(1.08);
      z-index: 10;
      border-color: var(--capoo-blue);
      /* 黃色與粉色的高亮發光氣泡陰影 */
      box-shadow: 0 0 25px rgba(0, 168, 232, 0.6), 0 8px 0px var(--capoo-pink);
      background-color: #ffffff;
      opacity: 1 !important;
      filter: blur(0px) !important;
    }

    /* 未被選中的卡片：變暗、變模糊 */
    .card.dimmed {
      opacity: 0.45;                             /* 降低不透明度變暗 */
      filter: blur(1.5px) grayscale(20%);         /* 微微模糊並降飽和度 */
      transform: scale(0.96);                    /* 稍微縮小襯托焦點 */
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 咖波的留言牆 🐾</h1>
  </header>

  <!-- 讀取中動畫區塊 -->
  <div id="loading-container">
    <div class="capoo-loader"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流留言卡片牆容器 -->
  <div class="masonry-wall" id="cards-container"></div>

  <script>
    /* =========================================================
       【參數設定區】 (方便後續修改秒數與參數)
       ========================================================= */
    // 💡 輪播切換間隔時間 (毫秒)：3000ms = 3 秒
    const CAROUSEL_INTERVAL = 3000; 

    // Google 試算表 CSV 發布網址
    const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2pwmugVupXQXECjPltDjHFdW-687od9V_71C0Fyr7G4qgKsBDxafDKDguDVx227pTO59ZKj5qV8dY/pub?output=csv';

    // 全域變數
    let messagesData = [];     // 存放解析後的 CSV 資料
    let currentIndex = 0;      // 當前高亮輪播的卡片索引
    let carouselTimer = null;  // 輪播計時器

    /* =========================================================
       【CSV 解析函式】
       妥善處理留言欄位中可能包含「雙引號」或「逗號」的情況
       ========================================================= */
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      const result = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue; // 跳過空白行

        const row = [];
        let insideQuote = false;
        let entry = '';

        for (let j = 0; j < line.length; j++) {
          const char = line[j];

          if (char === '"') {
            // 切換雙引號狀態（處理 CSV 內部字串保護）
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            // 當不在引號內遇到逗號，代表欄位分隔
            row.push(entry.trim());
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim()); // 推入最後一個欄位

        // 欄位順序預設：[0]時間戳記, [1]名字, [2]悄悄話/留言
        if (row.length >= 3) {
          result.push({
            timestamp: row[0].replace(/^"|"$/g, ''),
            name: row[1].replace(/^"|"$/g, ''),
            content: row[2].replace(/^"|"$/g, '')
          });
        }
      }
      return result;
    }

    /* =========================================================
       【動態生成留言卡片牆】
       ========================================================= */
    function renderCards(data) {
      const container = document.getElementById('cards-container');
      container.innerHTML = ''; // 清空容器

      // 第一筆通常是標題列 (時間戳記, 名字, 悄悄話)，我們予以過濾
      const validData = data.filter((item, index) => {
        if (index === 0 && item.name.includes('名字')) return false;
        return item.name || item.content;
      });

      messagesData = validData;

      if (messagesData.length === 0) {
        container.innerHTML = '<p style="text-align:center; width:100%;">目前還沒有任何留言喔！</p>';
        return;
      }

      // 循環建立 DOM 節點
      messagesData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">${escapeHTML(item.name || '無名氏')}</span>
            <span class="card-time">${escapeHTML(item.timestamp || '')}</span>
          </div>
          <div class="card-content">${escapeHTML(item.content || '')}</div>
        `;

        container.appendChild(card);
      });
    }

    /* 簡單的 HTML 轉義，防止 XSS 攻擊 */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* =========================================================
       【輪播 Highlight 邏輯】
       讓指定卡片亮起，其他卡片變暗
       ========================================================= */
    function startCarousel() {
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;

      // 清除舊的計時器 (若有)
      if (carouselTimer) clearInterval(carouselTimer);

      // 設定 setInterval 每隔指定秒數執行一次
      carouselTimer = setInterval(() => {
        cards.forEach((card, idx) => {
          if (idx === currentIndex) {
            // 被選中的卡片：加上亮起 class，移除變暗 class
            card.classList.add('highlight');
            card.classList.remove('dimmed');
            
            // 讓視窗平滑滾動至目前高亮卡片 (提升展覽觀看體驗)
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            // 未選中的卡片：加上變暗 class，移除亮起 class
            card.classList.add('dimmed');
            card.classList.remove('highlight');
          }
        });

        // 輪播索引遞增，輪播到底部時回到 0
        currentIndex = (currentIndex + 1) % cards.length;
      }, CAROUSEL_INTERVAL);
    }

    /* =========================================================
       【資料非同步讀取 (fetch)】
       ========================================================= */
    async function fetchMessages() {
      const loadingEl = document.getElementById('loading-container');

      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        
        if (!response.ok) {
          throw new Error(`HTTP 錯誤！狀態碼：${response.status}`);
        }

        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 隱藏「載入中」動畫
        loadingEl.style.display = 'none';

        // 渲染卡片並開啟輪播
        renderCards(parsedData);
        startCarousel();

      } catch (error) {
        console.error('抓取資料失敗:', error);
        loadingEl.innerHTML = `
          <div class="loading-text" style="color: #d62828;">
            😿 讀取留言失敗了！<br>
            <span style="font-size: 0.9rem; color: #666;">(${error.message})</span>
          </div>
        `;
      }
    }

    // 頁面載入完成後執行
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
